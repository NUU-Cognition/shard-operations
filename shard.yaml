shard-spec: "0.4.0"
shard: "@nuucognition/operations"
id: 132d001d-1972-4c14-8326-3598bd1fe00d
source:
  id: 54a9b195-c150-4fb5-bd93-9d3e66536009
version: "0.8.0"
name: Operations
shorthand: ops
description: Work in NUU Operations through the ops CLI — the main skill sk-ops-use_operations; tasks in two parts (a Flint task note and an Ops task, linked both ways) with the workflows create task, scope task, do task, create and do task, review task, and do task group; the projects note of the Flint; images and videos in Updates (ops media); projects, deliverables, sections, subtasks, task groups, the review queue, the people looped in, Trident streams and workspaces, shares, holds, calendars and events, agent sessions at Ops objects and the agent defaults, deployments and their inboxes, the route decision, addresses, deadlines, blockers, plans and the plan canvas, notepads, day plans, and ops query.

dependencies:
  "@nuucognition/flint": ""
  "@nuucognition/projects": "^1.6"

# The setup writes the Mesh note `Mesh/(System) Ops Projects.md` with the
# script projects-note (setup-ops.md). One setup for each Flint.
setup: flint

# Operations owns no Mesh artifact type, no artifact folder, and no
# dashboard. The data of Operations lives in the Operations Convex backend,
# and an agent reads and changes it only through the `ops` CLI. A task note
# uses the type Task and the template tmp-proj-task-v0.2 of the Projects
# shard (the dependency above). The task scripts (task-new, task-link,
# task-sync) and their knowledge came from the Tasks shard 0.6.0, which is
# deprecated since Operations 0.8.0.
